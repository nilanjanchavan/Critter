[project]
name = "critter"
version = "0.1.0"
description = "Customizable Desktop Pet Automation for Linux (Hyprland / Wayland)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Critter Team" }
]
dependencies = [
    "websockets>=13.0"
]

[project.scripts]
critter = "critter.apps.desktop.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


